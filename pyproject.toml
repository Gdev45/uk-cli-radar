[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-cli"
version = "0.2.0"
description = "UK Retro Radar - portrait Windows 95 style UK weather radar viewer"
requires-python = ">=3.10"

dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "h5py>=3.10",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "cartopy>=0.22",
    "pyproj>=3.5",
    "scipy>=1.10"
]

[project.scripts]
uk-radar = "weather_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
